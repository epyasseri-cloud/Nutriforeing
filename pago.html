<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio-Nutriforeing</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/informacion.css">
    <link rel="stylesheet" href="/css/pago.css">
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon"></div>
            <span>Nutriforeing</span>
        </div>
        <div class="header-right">
            <div class="notification-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
            </div>
            <img src="" alt="Profile" class="profile-pic">
        </div>
    </header>


    <main>
        <section class="payment-section">
            <div class="payment-container">
                <div class="payment-left">
                    <h1>Detalles de Pago</h1>
                    <p>Por favor ingresa tu información de pago.</p>
                </div>

                <div class="payment-right">
                    <form class="payment-form">
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" placeholder="Ingresa tu nombre completo" required>
                        </div>

                        <div class="form-group">
                            <label>Correo Electrónico</label>
                            <input type="email" placeholder="tuemail@ejemplo.com" required>
                        </div>

                        <div class="form-group">
                            <label>Método de Pago</label>
                            <div class="payment-methods">
                                <button type="button" class="payment-method-btn active">Tarjeta de Crédito</button>
                                <button type="button" class="payment-method-btn">PayPal</button>
                                <button type="button" class="payment-method-btn">Transferencia Bancaria</button>
                            </div>
                            <p class="payment-hint">Selecciona tu método de pago preferido</p>
                        </div>

                        <div class="form-group">
                            <label>Número de Tarjeta</label>
                            <input type="text" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Fecha de Expiración</label>
                                <input type="text" placeholder="MM/AA" maxlength="5" required>
                            </div>

                            <div class="form-group">
                                <label>Código de Seguridad</label>
                                <input type="text" placeholder="CVC" maxlength="3" required>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="cancel-btn">Cancelar</button>
                            <button type="submit" class="confirm-btn">Confirmar Pago</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        
        
    </footer>
</body>
</html>
